name: Autonomous Arbitrage Scan
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Commit and push latest signals
        run: |
          git config --global user.name "whyst0ne-bot"
          git config --global user.email "bot@whyst0ne.dev"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore(data): update real-time arbitrage signals [skip ci]"
          git push
